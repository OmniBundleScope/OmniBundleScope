name: release

# Tag-driven: `git tag v0.1.0 && git push origin v0.1.0` publishes a release.
# Nothing here runs on a normal push, so a broken main branch cannot ship a
# binary.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance, if the registry is configured for it

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate: an unsigned binary nobody should install is worse than no binary.
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check
      - run: cargo build --release
      - name: the tag must match the workspace version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log(m.packages.find(p=>p.name==="fastscope-cli")?.version??"")})')
          echo "tag=$TAG version=$VERSION"
          test "${TAG#v}" = "$VERSION" || {
            echo "::error::tag $TAG does not match fastscope-cli version $VERSION"; exit 1; }
      - name: the npm shim's own tests
        working-directory: npm/fastscope
        run: npm test
      # --deny, unlike CI's report. Publishing a release whose README links to a
      # repository that does not exist puts a broken page in front of every reader
      # of npm and crates.io, and it cannot be fixed after the fact without
      # publishing a new version.
      - name: no placeholder URLs in a release
        run: node bench/harness/links.mjs --deny

  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Fully static on Linux so the binary does not depend on the runner's glibc.
      - name: build
        run: cargo build --release --bin fastscope --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: x86_64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: package (${{ matrix.archive }})
        shell: bash
        working-directory: target/${{ matrix.target }}/release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="fastscope-${VERSION}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp fastscope.exe "${NAME}.exe"
            zip -q "${NAME}.zip" "${NAME}.exe"
            echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"
          else
            mkdir -p "${NAME}"
            cp fastscope "${NAME}/"
            # A licence and a version have to travel with the binary.
            cp ../../../LICENSE-MIT ../../../LICENSE-APACHE "${NAME}/"
            tar -czf "${NAME}.tar.gz" "${NAME}"
            rm -rf "${NAME}"
            echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.ASSET }}

  publish:
    name: publish the release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: RELEASE_NOTES.md

  npm:
    name: publish to npm
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: the package version must match the tag
        working-directory: npm/fastscope
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != npm $PKG"; exit 1; }
      # Skipped automatically for forks: they have no NPM_TOKEN, and a failed
      # publish on a fork would be noise rather than signal.
      - name: publish
        working-directory: npm/fastscope
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates-io:
    name: publish to crates.io
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    # crates.io is the secondary channel - npm and the release binaries are the
    # primary ones - so a failure here does not fail the release job. Publishing
    # the core first is mandatory and ordering is the whole difficulty: the CLI
    # depends on a *published* core, so a single `cargo publish` pass would
    # always fail on one of them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish fastscope-core
        run: |
          set -euo pipefail
          cargo publish -p fastscope-core --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          # crates.io needs a moment to serve the new version to the index
          # before anything can depend on it.
          sleep 30
      - name: publish fastscope-cli
        run: cargo publish -p fastscope-cli --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: publish fastscope-wasm
        run: cargo publish -p fastscope-wasm --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"